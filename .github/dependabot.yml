# Weekly update PRs for the pinned GitHub Actions and the Dockerfile's base
# images (they are pinned by digest; Dependabot moves the pins).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ttyd-client stage builds with Node 22 (yarn lockfile, corepack pin).
      # Move Node majors deliberately, not through a weekly bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
