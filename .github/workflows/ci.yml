name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck --version && shellcheck -S warning scripts/*.sh tests/*.sh
      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/cfg/hadolint.yaml:ro" hadolint/hadolint:v2.15.1 hadolint --config /cfg/hadolint.yaml --failure-threshold warning - < Dockerfile
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: node --check
        run: node --check scripts/web-front.js && node --check ttyd-client/inject-wasm-shim.js
      - name: web front end unit tests
        run: node --test tests/*.test.js
      - name: compose file
        run: docker compose -f docker-compose.yml config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan every commit, not just the tip
      - name: gitleaks (full history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (amd64, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: claude-code-remote-container:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: IMAGE=claude-code-remote-container:ci tests/smoke.sh
