name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck --version && shellcheck -S warning scripts/*.sh tests/*.sh
      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/cfg/hadolint.yaml:ro" hadolint/hadolint:v2.15.1 hadolint --config /cfg/hadolint.yaml --failure-threshold warning - < Dockerfile
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: node --check
        run: node --check scripts/web-front.js && node --check ttyd-client/inject-wasm-shim.js
      - name: web front end unit tests
        run: node --test tests/*.test.js
      - name: compose file
        run: docker compose -f docker-compose.yml config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # scan every commit, not just the tip
      - name: gitleaks (full history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: build (amd64, loaded locally)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: claude-code-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: IMAGE=claude-code-web:ci tests/smoke.sh
