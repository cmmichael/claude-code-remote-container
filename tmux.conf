# Used by the "claude" session served through ttyd.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
# Clipboard (OSC 52). set-clipboard on sends tmux's own copies (mouse drag,
# copy-mode, set-buffer -w) and copies from programs in the pane (Claude Code's
# "press c to copy") on to the browser. The Ms override pins the selection to
# "c": tmux fills %p1 with "" for its own copies and the web client's clipboard
# addon drops anything but "c", so %p1 is printed with zero width and "c" is
# hardcoded. The browser only accepts the write over HTTPS or localhost.
set -s set-clipboard on
set -as terminal-overrides ',xterm*:Ms=\E]52;c%p1%.0s;%p2%s\007'
# Forward OSC 8 hyperlinks. Claude Code prints the /login URL as one: it wraps
# over several rows, but every row carries the full URL, so clicking any row
# opens all of it. tmux only re-emits links when the outer terminal declares
# the feature (tmux >= 3.4).
set -as terminal-features ',xterm*:hyperlinks'
set -g allow-passthrough on
# Browser tab title; keep the status bar out of the way.
set -g set-titles on
set -g set-titles-string "claude: #W"
set -g status off
