# The web terminal on your tailnet only, via a Tailscale sidecar.
#
# Tailscale Serve terminates HTTPS at https://claude.<tailnet>.ts.net and adds
# Tailscale-User-Login for the tailnet user making the request. The claude
# container shares the sidecar's network namespace, so Serve reaches it on
# 127.0.0.1 - the only address CLAUDE_WEB_TRUSTED_PROXIES trusts by default -
# and nothing else can set that header.
#
#   TS_AUTHKEY=tskey-auth-... docker compose up -d
#
# Use this file from the repository root: docker compose -f examples/tailscale/docker-compose.yml up -d
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: claude                     # becomes claude.<tailnet>.ts.net
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY to a Tailscale auth key}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  claude:
    build: ../..
    image: claude-code-remote-container:local
    network_mode: service:tailscale      # share the sidecar's network: Serve -> 127.0.0.1:7681
    init: true
    stop_grace_period: 30s
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      - CLAUDE_RC_NAME=${CLAUDE_RC_NAME:-claude-web}
      - CLAUDE_WEB_AUTH=header           # Tailscale-User-Login, from 127.0.0.1 only
      - CLAUDE_WEB_ALLOWED_USERS=${CLAUDE_WEB_ALLOWED_USERS:?set to your tailnet login, e.g. you@github}
    volumes:
      - ../../config:/config
      - ${WORKSPACE_DIR:-../../workspace}:/workspace
    restart: unless-stopped
