<text x="34.8" y="90" fill="#d78787">▛███▛█</text>
<text x="110.4" y="90" fill="#e6e6e6" font-weight="700">Claude Code</text>
<text x="211.2" y="90" fill="#949494">v2.1.308</text>
<rect x="34.8" y="95" width="42.0" height="18" fill="#000000"/>
<text x="18.0" y="108" fill="#d78787">▝▜</text>
<text x="34.8" y="108" fill="#d78787">█████</text>
<text x="76.8" y="108" fill="#d78787">█▀</text>
<text x="110.4" y="108" fill="#949494">Haiku 5.5</text>
<text x="18.0" y="126" fill="#d78787"> ▝▝   ▝▝ </text>
<text x="110.4" y="126" fill="#949494">/workspace/homelab</text>
<rect x="18.0" y="149" width="16.8" height="18" fill="#3a3a3a"/>
<rect x="34.8" y="149" width="814.8" height="18" fill="#3a3a3a"/>
<text x="18.0" y="162" fill="#949494">❯ </text>
<text x="34.8" y="162" fill="#ffffff">Review docker-compose.yml on this NAS. Which services are exposed more than they need to be, and </text>
<text x="34.8" y="180" fill="#ffffff">what's the smallest fix for each? Keep it short.</text>
<text x="34.8" y="216" fill="#949494">Ran </text>
<text x="68.4" y="216" fill="#949494" font-weight="700">1</text>
<text x="76.8" y="216" fill="#949494"> shell command </text>
<text x="18.0" y="252" fill="#ffffff">●</text>
<text x="26.4" y="252" fill="#e6e6e6"> The file is </text>
<text x="135.6" y="252" fill="#afd7ff">docker-compose.yml</text>
<text x="286.8" y="252" fill="#e6e6e6"> at the repo root. Three services publish ports to every interface, and</text>
<text x="18.0" y="270" fill="#e6e6e6">  one mounts the Docker socket.</text>
<text x="34.8" y="306" fill="#e6e6e6" font-weight="700">Exposed more than needed</text>
<text x="18.0" y="342" fill="#e6e6e6">  1. </text>
<text x="60.0" y="342" fill="#afd7ff" font-weight="700">db</text>
<text x="76.8" y="342" fill="#e6e6e6" font-weight="700"> (postgres), port 5432: worst one.</text>
<text x="362.4" y="342" fill="#e6e6e6"> Paperless reaches it over the compose network by service name,</text>
<text x="18.0" y="360" fill="#e6e6e6">     so the host port isn't needed. </text>
<text x="320.4" y="360" fill="#e6e6e6" font-weight="700">Fix:</text>
<text x="354.0" y="360" fill="#e6e6e6"> delete the </text>
<text x="454.8" y="360" fill="#afd7ff">ports:</text>
<text x="505.2" y="360" fill="#e6e6e6"> block. The password is also </text>
<text x="748.8" y="360" fill="#afd7ff">postgres</text>
<text x="816.0" y="360" fill="#e6e6e6">, so</text>
<text x="18.0" y="378" fill="#e6e6e6">     move it into a </text>
<text x="186.0" y="378" fill="#afd7ff">.env</text>
<text x="219.6" y="378" fill="#e6e6e6"> file and use a strong value.</text>
<text x="18.0" y="396" fill="#e6e6e6">  2. </text>
<text x="60.0" y="396" fill="#afd7ff" font-weight="700">uptime</text>
<text x="110.4" y="396" fill="#e6e6e6" font-weight="700"> (Uptime Kuma), </text>
<text x="244.8" y="396" fill="#afd7ff" font-weight="700">/var/run/docker.sock</text>
<text x="412.8" y="396" fill="#e6e6e6" font-weight="700"> mount: the bigger risk.</text>
<text x="614.4" y="396" fill="#e6e6e6"> Anyone who compromises that</text>
<text x="18.0" y="414" fill="#e6e6e6">     container gets root on the NAS, since the socket controls the Docker daemon. </text>
<text x="706.8" y="414" fill="#e6e6e6" font-weight="700">Fix:</text>
<text x="740.4" y="414" fill="#e6e6e6"> remove the socket</text>
<text x="18.0" y="432" fill="#e6e6e6">     mount if you don't use Uptime Kuma's Docker monitors. If you do, put </text>
<text x="639.6" y="432" fill="#afd7ff">tecnativa/docker-socket-proxy</text>
<text x="18.0" y="450" fill="#e6e6e6">     in front and mount the proxy's socket instead of the real one.</text>
</g>
