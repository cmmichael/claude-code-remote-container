<circle cx="20" cy="22" r="6" fill="#ff5f57"/>
<circle cx="38" cy="22" r="6" fill="#febc2e"/>
<circle cx="56" cy="22" r="6" fill="#28c840"/>
<rect x="245" y="10" width="420" height="24" rx="12" fill="#1a1c20"/>
<text x="455" y="27" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">🔒 claude.example.com</text>
<g font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<rect x="34.8" y="77" width="50.4" height="18" fill="#000000"/>
<text x="18.0" y="90" fill="#d78787"> ▐</text>
<text x="34.8" y="90" fill="#d78787">▛███▛█</text>
<text x="110.4" y="90" fill="#e6e6e6" font-weight="700">Claude Code</text>
<text x="211.2" y="90" fill="#949494">v2.1.308</text>
<rect x="34.8" y="95" width="42.0" height="18" fill="#000000"/>
<text x="18.0" y="108" fill="#d78787">▝▜</text>
<text x="34.8" y="108" fill="#d78787">█████</text>
<text x="76.8" y="108" fill="#d78787">█▀</text>
<text x="110.4" y="108" fill="#949494">Haiku 5.5</text>
<text x="18.0" y="126" fill="#d78787"> ▝▝   ▝▝ </text>
<text x="110.4" y="126" fill="#949494">/workspace/homelab</text>
<rect x="18.0" y="149" width="16.8" height="18" fill="#3a3a3a"/>
<rect x="34.8" y="149" width="814.8" height="18" fill="#3a3a3a"/>
<text x="18.0" y="162" fill="#949494">❯ </text>
<text x="34.8" y="162" fill="#ffffff">Review docker-compose.yml on this NAS. Which services are exposed more than they need to be, and </text>
<text x="34.8" y="180" fill="#ffffff">what's the smallest fix for each? Keep it short.</text>
<text x="34.8" y="216" fill="#949494">Ran </text>
<text x="68.4" y="216" fill="#949494" font-weight="700">1</text>
<text x="76.8" y="216" fill="#949494"> shell command </text>
<text x="18.0" y="252" fill="#ffffff">●</text>
<text x="26.4" y="252" fill="#e6e6e6"> The file is </text>
<text x="135.6" y="252" fill="#afd7ff">docker-compose.yml</text>
<text x="286.8" y="252" fill="#e6e6e6"> at the repo root. Three services publish ports to every interface, and</text>
<text x="18.0" y="270" fill="#e6e6e6">  one mounts the Docker socket.</text>
<text x="34.8" y="306" fill="#e6e6e6" font-weight="700">Exposed more than needed</text>
<text x="18.0" y="342" fill="#e6e6e6">  1. </text>
<text x="60.0" y="342" fill="#afd7ff" font-weight="700">db</text>
<text x="76.8" y="342" fill="#e6e6e6" font-weight="700"> (postgres), port 5432: worst one.</text>
<text x="362.4" y="342" fill="#e6e6e6"> Paperless reaches it over the compose network by service name,</text>
<text x="18.0" y="360" fill="#e6e6e6">     so the host port isn't needed. </text>
<text x="320.4" y="360" fill="#e6e6e6" font-weight="700">Fix:</text>
<text x="354.0" y="360" fill="#e6e6e6"> delete the </text>
<text x="454.8" y="360" fill="#afd7ff">ports:</text>
<text x="505.2" y="360" fill="#e6e6e6"> block. The password is also </text>
<text x="748.8" y="360" fill="#afd7ff">postgres</text>
<text x="816.0" y="360" fill="#e6e6e6">, so</text>
<text x="18.0" y="378" fill="#e6e6e6">     move it into a </text>
<text x="186.0" y="378" fill="#afd7ff">.env</text>
<text x="219.6" y="378" fill="#e6e6e6"> file and use a strong value.</text>
<text x="18.0" y="396" fill="#e6e6e6">  2. </text>
<text x="60.0" y="396" fill="#afd7ff" font-weight="700">uptime</text>
<text x="110.4" y="396" fill="#e6e6e6" font-weight="700"> (Uptime Kuma), </text>
<text x="244.8" y="396" fill="#afd7ff" font-weight="700">/var/run/docker.sock</text>
<text x="412.8" y="396" fill="#e6e6e6" font-weight="700"> mount: the bigger risk.</text>
<text x="614.4" y="396" fill="#e6e6e6"> Anyone who compromises that</text>
<text x="18.0" y="414" fill="#e6e6e6">     container gets root on the NAS, since the socket controls the Docker daemon. </text>
<text x="706.8" y="414" fill="#e6e6e6" font-weight="700">Fix:</text>
<text x="740.4" y="414" fill="#e6e6e6"> remove the socket</text>
<text x="18.0" y="432" fill="#e6e6e6">     mount if you don't use Uptime Kuma's Docker monitors. If you do, put </text>
<text x="639.6" y="432" fill="#afd7ff">tecnativa/docker-socket-proxy</text>
<text x="18.0" y="450" fill="#e6e6e6">     in front and mount the proxy's socket instead of the real one.</text>
<text x="18.0" y="468" fill="#e6e6e6">  3. </text>
<text x="60.0" y="468" fill="#afd7ff" font-weight="700">uptime</text>
<text x="110.4" y="468" fill="#e6e6e6" font-weight="700">, port 3001, and </text>
<text x="253.2" y="468" fill="#afd7ff" font-weight="700">paperless</text>
<text x="328.8" y="468" fill="#e6e6e6" font-weight="700">, port 8000: bind to the LAN or localhost only if you don't need </text>
<text x="60.0" y="486" fill="#e6e6e6" font-weight="700">them open.</text>
<text x="152.4" y="486" fill="#e6e6e6" font-weight="700">Fix:</text>
<text x="186.0" y="486" fill="#e6e6e6"> if a reverse proxy fronts them, change to </text>
<text x="547.2" y="486" fill="#afd7ff">"127.0.0.1:8000:8000"</text>
<text x="723.6" y="486" fill="#e6e6e6"> and</text>
<text x="60.0" y="504" fill="#afd7ff">"127.0.0.1:3001:3001"</text>
<text x="236.4" y="504" fill="#e6e6e6">. If you just browse them directly on your LAN, leave them alone.</text>
<text x="34.8" y="540" fill="#e6e6e6" font-weight="700">Left alone</text>
<text x="18.0" y="576" fill="#e6e6e6">  - </text>
<text x="51.6" y="576" fill="#afd7ff" font-weight="700">jellyfin</text>
<text x="118.8" y="576" fill="#e6e6e6" font-weight="700">, port 8096:</text>
<text x="219.6" y="576" fill="#e6e6e6"> clients need it, so the open port is expected. Its media mount is already</text>
<text x="18.0" y="594" fill="#e6e6e6">    read-only (</text>
<text x="144.0" y="594" fill="#afd7ff">:ro</text>
<text x="169.2" y="594" fill="#e6e6e6">), which is correct.</text>
<text x="34.8" y="630" fill="#e6e6e6" font-weight="700">Related problem to fix while you're in there</text>
<text x="18.0" y="666" fill="#e6e6e6">  - Paperless will likely fail to connect to Postgres. The </text>
<text x="513.6" y="666" fill="#afd7ff">db</text>
<text x="530.4" y="666" fill="#e6e6e6"> service uses the </text>
<text x="681.6" y="666" fill="#afd7ff">postgres</text>
<text x="748.8" y="666" fill="#e6e6e6"> user and</text>
<text x="18.0" y="684" fill="#e6e6e6">    password, but Paperless defaults to user and password </text>
<text x="505.2" y="684" fill="#afd7ff">paperless</text>
<text x="580.8" y="684" fill="#e6e6e6">. Add </text>
<text x="631.2" y="684" fill="#afd7ff">PAPERLESS_DBUSER=postgres</text>
<text x="841.2" y="684" fill="#e6e6e6"> and</text>
<text x="51.6" y="702" fill="#afd7ff">PAPERLESS_DBPASS=&lt;same password&gt;</text>
<text x="320.4" y="702" fill="#e6e6e6"> to the </text>
<text x="387.6" y="702" fill="#afd7ff">paperless</text>
<text x="463.2" y="702" fill="#e6e6e6"> environment.</text>
<text x="18.0" y="720" fill="#e6e6e6">  - </text>
<text x="51.6" y="720" fill="#afd7ff">PAPERLESS_SECRET_KEY=change-me</text>
<text x="303.6" y="720" fill="#e6e6e6"> is also a placeholder. Replace it with a random value.</text>
<text x="18.0" y="756" fill="#949494">✻</text>
<text x="34.8" y="756" fill="#949494">Baked for 14s · done 1:44 AM</text>
<text x="18.0" y="828" fill="#808080">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="846" fill="#e6e6e6">❯ </text>
<text x="34.8" y="846" fill="#e6e6e6" opacity="0.6">apply those fixes to docker-compose.yml</text>
<text x="18.0" y="864" fill="#808080">────────────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="34.8" y="882" fill="#ffd700">⏵⏵ auto mode on</text>
<text x="160.8" y="882" fill="#949494"> (shift+tab to cycle)</text>
</g>
