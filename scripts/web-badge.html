<!-- claude-code-remote-container: app-sessions badge, added to ttyd's page by web-front.js -->
<style>
  #cw-badge, #cw-panel { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e6e6e6; }
  #cw-badge {
    position: fixed; top: 8px; right: 12px; z-index: 1000; display: none;
    align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    background: rgba(40, 40, 46, .85); border: 1px solid rgba(255, 255, 255, .14);
    cursor: pointer; opacity: .55; transition: opacity .15s; user-select: none;
  }
  #cw-badge:hover, #cw-badge.cw-open { opacity: 1; }
  #cw-dot { width: 7px; height: 7px; border-radius: 50%; background: #8a8a93; }
  #cw-badge.cw-busy #cw-dot { background: #4ade80; animation: cw-pulse 1.2s ease-in-out infinite; }
  @keyframes cw-pulse { 50% { opacity: .35; } }
  #cw-panel {
    position: fixed; top: 36px; right: 12px; z-index: 1001; display: none; width: min(340px, calc(100vw - 24px));
    max-height: 60vh; overflow: auto; padding: 8px; border-radius: 8px;
    background: #1f1f24; border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
  #cw-panel h4 { margin: 2px 4px 6px; font-size: 12px; font-weight: 600; color: #a1a1aa; }
  .cw-row { display: block; padding: 6px 8px; border-radius: 6px; color: inherit; text-decoration: none; }
  .cw-row:hover { background: rgba(255, 255, 255, .07); }
  .cw-row b { font-weight: 600; }
  .cw-meta { color: #a1a1aa; }
  .cw-state { float: right; color: #a1a1aa; }
  .cw-row.cw-busy .cw-state { color: #4ade80; }
  #cw-foot { display: block; margin-top: 4px; padding: 6px 8px; color: #93c5fd; text-decoration: none; border-top: 1px solid rgba(255, 255, 255, .08); }
</style>
<div id="cw-badge" title="Sessions started from claude.ai/code or the Claude app"><span id="cw-dot"></span><span id="cw-label"></span></div>
<div id="cw-panel"></div>
<script>
(function () {
  var badge = document.getElementById('cw-badge');
  var label = document.getElementById('cw-label');
  var panel = document.getElementById('cw-panel');
  var last = null, timer = null;

  function ago(t, now) {
    var s = Math.max(0, now - t);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    return Math.floor(s / 86400) + ' d ago';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function render() {
    var d = last;
    var list = (d && d.server && d.server.running && d.sessions) || [];
    var n = list.filter(function (s) { return !s.server_session; }).length;
    // The server's own session alone doesn't count: show the badge for app
    // sessions, or while any session (the server's included) is working.
    if (!n && !(d && d.busy)) { badge.style.display = 'none'; panel.style.display = 'none'; badge.classList.remove('cw-open'); return; }
    badge.style.display = 'inline-flex';
    badge.classList.toggle('cw-busy', !!d.busy);
    label.textContent = n + (n === 1 ? ' app session' : ' app sessions');
    panel.textContent = '';
    panel.appendChild(el('h4', null, 'App sessions on this server'));
    list.forEach(function (s) {
      var a = el('a', 'cw-row' + (s.busy ? ' cw-busy' : ''));
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('span', 'cw-state', s.busy ? '● working' : 'idle'));
      a.appendChild(el('b', null, s.server_session ? "Server's own session" : (s.id || 'session').replace(/^cse_/, '').slice(-8)));
      var act = s.last_stop || s.last_prompt;
      a.appendChild(el('div', 'cw-meta', 'started ' + ago(s.started, d.now) +
        (act ? ' · active ' + ago(Math.max(s.last_prompt || 0, s.last_stop || 0), d.now) : '') + ' · ' + s.version));
      panel.appendChild(a);
    });
    var foot = el('a', null, 'Open claude.ai/code ↗');
    foot.id = 'cw-foot'; foot.href = 'https://claude.ai/code'; foot.target = '_blank'; foot.rel = 'noopener';
    panel.appendChild(foot);
  }
  function poll() {
    clearTimeout(timer);
    if (document.hidden) return;
    fetch('api/sessions', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { last = d; render(); }, function () { last = null; render(); })
      .then(function () { timer = setTimeout(poll, 10000); });
  }
  function close() {
    panel.style.display = 'none'; badge.classList.remove('cw-open');
    if (window.term && window.term.focus) window.term.focus();
  }
  badge.addEventListener('click', function (e) {
    e.stopPropagation();
    if (panel.style.display === 'block') return close();
    panel.style.display = 'block'; badge.classList.add('cw-open');
  });
  panel.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (panel.style.display === 'block') close(); });
  // Capture phase, and stop it there: an Esc reaching the terminal would interrupt Claude's turn.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && panel.style.display === 'block') { e.preventDefault(); e.stopPropagation(); close(); }
  }, true);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  poll();
})();
</script>
