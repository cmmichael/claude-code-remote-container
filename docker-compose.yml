services:
  claude:
    build: .
    # Or skip the local build and pull the prebuilt image (private: `docker login ghcr.io` first):
    # image: ghcr.io/<owner>/claude-code-web:latest
    image: claude-code-web:local
    container_name: claude
    hostname: claude          # Remote Control sessions show up as "<hostname>-web"
    init: true                # reaps orphaned tool processes
    stop_grace_period: 30s    # Claude gets up to CLAUDE_STOP_GRACE_SECS (20) to exit on stop
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-UTC}
      # Name shown in claude.ai/code and the Claude app for the web-terminal session
      - CLAUDE_RC_NAME=${CLAUDE_RC_NAME:-claude-web}
      # Optional ttyd basic auth (user:password). Use it when no auth proxy is in front.
      - TTYD_CREDENTIAL=${TTYD_CREDENTIAL:-}
      # Who may use the web terminal, checked inside the container on every request:
      # none, pomerium (verify Pomerium's signed assertion) or header (trust an
      # identity header, e.g. from Tailscale Serve, from CLAUDE_WEB_TRUSTED_PROXIES).
      - CLAUDE_WEB_AUTH=${CLAUDE_WEB_AUTH:-none}
      - CLAUDE_WEB_ALLOWED_USERS=${CLAUDE_WEB_ALLOWED_USERS:-}    # you@example.com, *@example.com, or *
      - CLAUDE_WEB_POMERIUM_JWKS_URL=${CLAUDE_WEB_POMERIUM_JWKS_URL:-}
      - CLAUDE_WEB_POMERIUM_AUDIENCE=${CLAUDE_WEB_POMERIUM_AUDIENCE:-}
      - CLAUDE_WEB_AUTH_HEADER=${CLAUDE_WEB_AUTH_HEADER:-Tailscale-User-Login}
      - CLAUDE_WEB_TRUSTED_PROXIES=${CLAUDE_WEB_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      # Restart idle sessions onto newly downloaded Claude Code versions
      - CLAUDE_AUTO_UPDATE_RESTART=true
      - CLAUDE_UPDATE_IDLE_SECS=900
      # Claude Code release channel: stable (about a week behind latest) or latest
      - CLAUDE_UPDATE_CHANNEL=${CLAUDE_UPDATE_CHANNEL:-stable}
      # Separate Remote Control server for starting new sessions from the app
      - CLAUDE_REMOTE_CONTROL_SERVER=true
      - CLAUDE_RC_SERVER_NAME=${CLAUDE_RC_SERVER_NAME:-}          # title of its start-up session; default: the hostname
      - CLAUDE_RC_PERMISSION_MODE=${CLAUDE_RC_PERMISSION_MODE:-}  # for sessions started from the app, e.g. acceptEdits
      # Optional: let Claude drive Docker through a restricted socket proxy, e.g.
      # - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - ./config:/config           # HOME: claude binary, login, transcripts. Keep private.
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    ports:
      # Loopback only by default. Expose through an authenticating reverse proxy
      # (see examples/) instead of widening this.
      - "127.0.0.1:${TTYD_PORT:-7681}:7681"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
